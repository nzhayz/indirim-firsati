name: Günlük İndirim Taraması

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır ve e-posta gönder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scheduled_task.py
